[tool.poetry]
name = "xenonpy"
version = "0.7.0-alpha.1"
description = "A Python library for materials informatics"
authors = ["TsumiNa <liu.chang.1865@gmail.com>"]
maintainers = ["TsumiNa <liu.chang.1865@gmail.com>", "stewu5"]
license = "BSD-3-Clause"
readme = "README.md"
classifiers = [
    'Development Status :: 4 - Beta',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Physics',
]

packages = [{ include = "xenonpy" }]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/nightly/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = "^1.24"
scipy = "^1.10"
pandas = "^2.0"
pymatgen = "^2023.1"
ase = "^3.22"
rdkit = ">=2022.3.3,<2025"
matminer = "^0.8"
seaborn = "^0.12.2"
scikit-learn = "^1.2.1"
jupyterlab = "^4.0"
ipywidgets = "^8.0"
requests = "^2.28.2"
"ruamel.yaml" = "^0.17.22"
joblib = "^1.2.0"
tqdm = "^4.65"
mordred = { version = "^1.2.0", optional = true }

[tool.poetry.extras]
outdated = ["mordred"]

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.2"
torch = { version = "^2.0.0+cpu", source = "pytorch-cpu" }

[tool.poetry.group.test.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"

[tool.poetry.group.docs.dependencies]
Sphinx = "^7.4.3"
sphinx-rtd-theme = "^2.0.0"
nbsphinx = "^0.9.4"
nbconvert = "^7.16.4"
sphinx-autodoc-typehints = "^2.2.2"

[tool.ruff]
exclude = [".venv", "venv", "__pycache__", ".git"]
line-length = 88
indent-width = 4
src = ["xenonpy"]

[tool.ruff.lint]
# PEP8
select = [
    "F", # Pyflakes
    "E", # pycodestyle
    "W", # pycodestyle
]
ignore = [
    "F841", # unused-variable
    "E741", # ambiguous-variable-name
    "W505", # doc-line-too-long
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.mccabe]
# C901
max-complexity = 8

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
